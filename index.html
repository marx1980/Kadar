<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kadar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2C2E31">
<title>Kadar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:'Barlow SC';font-weight:400;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Barlow SC';font-weight:400;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Barlow SC';font-weight:600;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Barlow SC';font-weight:600;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Barlow SC';font-weight:700;font-display:swap;src:url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format('woff2')}

:root{
  --bg:#2C2E31; --surface:#36393D; --raise:#41454A; --ink:#EFECE4; --muted:#B8BBBE; --line:#4A4E53;
  --mark:#F2C230; --reject:#E4604B; color-scheme:dark;
  --gut:16px; --btn-h:48px; --btn-sm:40px; --tap:44px;
  --r-sm:6px; --r-card:12px; --r-pill:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:400 17px/1.35 'Barlow SC',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,label.btn{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--mark);outline-offset:2px}
.num{font-weight:700;font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:8px;padding:10px var(--gut);min-height:52px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h2{font-size:20px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:20px}
.icon:active{background:var(--raise)}
.icon[disabled]{opacity:.3}
.icon svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--btn-h);min-width:var(--tap);padding:0 20px;border-radius:var(--r-pill);background:var(--raise);font-weight:600}
.btn.primary{background:var(--mark);color:#26231a}
.btn:active{filter:brightness(.92)}
.btn[disabled]{opacity:.4}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* home */
.home{min-height:calc(100dvh - 52px - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px var(--gut) 52px}
.home-intro{width:min(420px,100%);text-align:center}
.home-intro h1{font-size:30px;line-height:1.1;margin:4px 0 10px}
.home-intro p,.library-note{color:var(--muted);max-width:38ch;margin:0 auto}
.home-actions{display:grid;gap:10px;width:min(360px,100%)}
.home-actions .btn{width:100%}
.home-actions .secondary{background:var(--surface)}
.home-actions .recent-action{justify-content:space-between}
.recent-action span{font-size:14px;color:var(--muted)}
.wordmark{position:relative;font-size:52px;font-weight:600;letter-spacing:-.01em;line-height:1;padding:14px 28px}
.wordmark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.library-note{font-size:15px;text-align:center}
.ring{fill:none;stroke:var(--mark);stroke-width:3.2;stroke-linecap:round}
.progress{width:min(320px,100%);display:grid;gap:10px;justify-items:center}
.bar{width:100%;height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark);width:0;transition:width .2s}
.err{color:var(--reject);text-align:center;max-width:32ch}

/* summary + series list */
.summary{display:flex;flex-wrap:wrap;gap:18px;padding:4px var(--gut) 14px}
.stat{display:grid}
.stat b{font-size:28px;line-height:1.05}
.stat span{color:var(--muted);font-size:15px}
.stat.k b{color:var(--mark)}
.stat.d b{color:var(--reject)}
.actions{display:flex;gap:10px;padding:0 var(--gut) 16px}
.actions .btn{flex:1}
.list{display:grid;gap:2px;padding-bottom:24px}
.row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:12px var(--gut);background:var(--surface);text-align:left;width:100%}
.row:active{background:var(--raise)}
.row .sn{color:var(--muted);font-size:18px}
.strip{display:flex;gap:8px;overflow:hidden;align-items:center}
.strip .more{color:var(--muted);font-size:16px;padding-left:2px}
.counts{display:grid;justify-items:end;font-size:15px;color:var(--muted)}
.counts .k{color:var(--mark)}
.counts .d{color:var(--reject)}

/* frames (shared by strips, filmstrip, delete grid) */
.fr{display:block;position:relative;flex:0 0 auto;width:56px;height:56px;border-radius:4px}
.fr img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.fr .ring{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);overflow:visible;pointer-events:none}
.fr.del img{opacity:.38;filter:grayscale(.6)}
.fr .x{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.x line{stroke:var(--reject);stroke-width:2.4;stroke-linecap:round}
.fr .fn{position:absolute;left:3px;bottom:2px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}

/* review */
.stage{padding:0 var(--gut)}
.photo{position:relative;margin:0 auto;max-height:58dvh;touch-action:pan-y}
.photo img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px}
.fb{position:absolute;border:1.5px solid rgba(239,236,228,.55);border-radius:6px}
.fb.bad{border:2px solid var(--reject)}
.ov{position:absolute;border:2px dashed var(--reject);border-radius:6px;pointer-events:none;box-sizing:border-box}
.ov.whole{border-radius:0}
.ov i{position:absolute;left:-2px;top:-2px;transform:translateY(-100%);background:var(--reject);color:#fff;font-style:normal;font-size:12px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.ov.whole i{top:auto;bottom:-2px;transform:none}
.ov-blur{border-color:#6BB6FF}.ov-blur i{background:#6BB6FF;color:#000}
.ov-exposure{border-color:var(--mark)}.ov-exposure i{background:var(--mark);color:#000}
.badge{position:absolute;left:10px;top:10px;min-width:40px;height:40px;display:grid;place-items:center;font-size:20px;font-weight:700;background:rgba(32,33,36,.72);border-radius:20px;padding:0 10px}
.badge svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);overflow:visible}
.bar2{display:flex;align-items:center;gap:10px;padding:14px var(--gut) 6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-height:32px;align-items:center}
.chip{height:30px;padding:0 12px;border-radius:15px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;background:var(--raise)}
.chip.bad{background:rgba(228,96,75,.18);color:#FFB4A6}
.chip.face{background:rgba(242,194,48,.16);color:var(--mark)}
.seg{display:inline-flex;background:var(--raise);border-radius:22px;padding:3px}
.seg button{height:var(--btn-sm);min-width:var(--tap);padding:0 16px;border-radius:19px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--mark);color:#26231a}
.seg.decide button[aria-pressed=true][data-v=delete]{background:var(--reject);color:#2a1410}
.faces{display:flex;gap:10px;overflow-x:auto;padding:8px var(--gut);scrollbar-width:none}
.face{flex:0 0 auto;width:min(44vw,200px);display:grid;gap:3px;justify-items:center;font-size:14px;color:var(--muted)}
.face img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;border:2px solid transparent}
.face.bad img{border-color:var(--reject)}
.face.bad{color:#FFB4A6}
.film{display:flex;gap:12px;overflow-x:auto;padding:12px var(--gut) 20px;scrollbar-width:none}
.film .fr{width:64px;height:64px}
.film .fr.cur::after{content:"";position:absolute;left:8px;right:8px;bottom:-10px;height:3px;border-radius:2px;background:var(--ink)}

/* delete list */
.sec{padding:16px var(--gut) 8px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:0 var(--gut)}
.grid .fr{width:auto;height:auto;aspect-ratio:1}
.grid .fr img{opacity:1;filter:none}

/* settings sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet>div{width:100%;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--gut);flex-wrap:wrap}
.set .seg button{padding:0 12px;font-size:16px}
.sheet .done{display:flex;justify-content:flex-end;padding:8px var(--gut)}
.editor-stage{padding-top:4px}
.editor-nav{display:flex;align-items:center;justify-content:space-between;padding:8px var(--gut);color:var(--muted)}
.editor-nav .btn{height:var(--btn-sm);padding:0 14px}
.editor-nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.editor-history{display:flex;gap:8px;padding:4px var(--gut);justify-content:flex-end}
.editor-history .btn{height:var(--btn-sm);padding:0 14px}
.editor-history .btn[disabled]{opacity:.4}
.edit-group{margin:6px var(--gut);padding:0 10px 8px;background:var(--surface);border-radius:10px}
.edit-group>summary{padding:12px 2px;font-weight:600;cursor:pointer;list-style-position:inside}
.edit-group .adjust{padding-left:2px;padding-right:2px}
.look-list{display:flex;gap:8px;overflow-x:auto}
.look-list .btn{height:var(--btn-sm);padding:0 14px}
.look-list .btn[aria-pressed=true]{background:var(--mark);color:#26231a}
.save-look,.manage-look{display:flex;gap:8px;padding-top:8px}
.save-look input,.manage-look input{min-width:0;flex:1;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink);font:inherit;padding:0 12px}
.save-look .btn,.manage-look .btn{height:var(--btn-sm);padding:0 14px}
.curve-editor,.hsl-group,.hsl-channel{margin:8px 0;padding:0 8px;background:var(--bg);border-radius:8px}
.curve-editor>summary,.hsl-group>summary,.hsl-channel>summary{padding:10px 0;color:var(--ink);cursor:pointer}
.tone-curve{display:block;width:100%;height:120px;background:var(--surface);border-radius:6px}
.tone-curve-grid{fill:none;stroke:var(--line);stroke-width:1}
.tone-curve polyline{fill:none;stroke:var(--mark);stroke-width:2}
.reset-control{border:1px solid var(--line);border-radius:var(--r-pill);min-height:var(--tap);min-width:var(--tap);padding:2px 10px;color:var(--muted);font:inherit;font-size:14px}
.editor-photo{position:relative;margin:0 auto;max-height:52dvh;overflow:hidden;border-radius:6px;background:#1f2022;cursor:crosshair}
.editor-photo.brushing{touch-action:none}
.editor-photo img,.editor-photo canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.editor-photo [hidden]{display:none}
.focus-tools{padding:4px var(--gut);color:var(--muted)}
.focus-tools>span{display:block;padding:4px 0}
.focus-actions{display:flex;align-items:center;gap:8px;padding:4px 0}
.focus-actions .btn{height:var(--btn-sm)}
.focus-actions [aria-pressed=true]{background:var(--mark);color:#26231a}
.depth-note{margin:0;padding:2px 0;color:var(--muted);font-size:14px}
.mask-brush{display:grid;grid-template-columns:auto 1fr;align-items:center}
.mask-brush .adjust{min-width:120px;padding:4px}
.crop-set{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px var(--gut);color:var(--muted)}
.crop-set .seg button{padding:0 12px}
.adjust{display:grid;gap:5px;padding:8px var(--gut);color:var(--muted)}
.adjust span{display:flex;justify-content:space-between;color:var(--ink)}
.adjust output{color:var(--muted);font-variant-numeric:tabular-nums}
.adjust input{width:100%;accent-color:var(--mark)}
.editor-actions{display:flex;gap:10px;padding:10px var(--gut) 20px;flex-wrap:wrap}
.editor-actions .btn{flex:1 1 auto}
.recovery-tools{width:100%;display:grid;gap:8px;padding:12px;background:var(--surface);border-radius:10px}
.recovery-tools>strong{font-size:18px}
.recovery-tools>span,.delete-note{color:var(--muted)}
.delete-note{padding:8px var(--gut) 16px}
.editor-error{padding:0 var(--gut) 8px}

/* novice help, editor layout, tutorials */
[data-help]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input[type=text]{-webkit-user-select:text;user-select:text}
.edit-group{border-radius:var(--r-card)}
.edit-group>summary{min-height:var(--tap);display:flex;align-items:center}
.editor-sticky{position:sticky;top:52px;z-index:4;background:var(--bg);padding-bottom:4px}
.editor-history{align-items:center;justify-content:space-between}
.editor-history .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px var(--gut)}
.hint,.notice{margin:4px var(--gut);padding:8px 12px;border-radius:var(--r-sm);background:rgba(242,194,48,.16);color:var(--mark);font-size:15px}
.review-note,.save-note{color:var(--muted);font-size:14px;padding:0 var(--gut) 8px}
.save-bar{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.save-bar p{flex:1;padding:0;margin:0}
.save-bar .notice{background:none;padding:0}
.home-guide{list-style:none;display:grid;gap:6px;width:min(360px,100%);color:var(--muted);font-size:15px}
.home-guide b{color:var(--ink)}
.tour-prompt{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--r-card);background:var(--surface);width:min(360px,100%)}
.tour-prompt span{flex:1 0 100%;text-align:center}
.tour-prompt .btn{height:var(--btn-sm)}
.chip[tabindex]{min-height:var(--tap);}
#help-tip{position:fixed;z-index:60;max-width:min(300px,calc(100vw - 16px));padding:12px;border-radius:var(--r-card);background:var(--ink);color:#222;font-size:15px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
#help-tip.show{opacity:1}
#help-tip p{margin:0 0 8px}
#help-tip button{height:var(--tap);padding:0 14px;border-radius:var(--r-pill);background:#222;color:var(--ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;max-width:min(360px,calc(100vw - 32px));padding:10px 16px;border-radius:var(--r-pill);background:var(--ink);color:#222;font-weight:600;text-align:center}
#tour{position:fixed;inset:0;z-index:50;pointer-events:none}
#tour[hidden]{display:none}
#tour.tour-list{pointer-events:auto;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.tour-card{pointer-events:auto;display:grid;gap:8px;width:min(360px,100%);max-height:88dvh;overflow:auto;padding:16px;border-radius:var(--r-card);background:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tour-step .tour-card{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(360px,calc(100% - 32px))}
.tour-step .tour-card.top{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
.tour-spot{position:fixed;border-radius:var(--r-sm);box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:2px solid var(--mark)}
.tour-actions{display:flex;gap:8px;justify-content:flex-end}
.tour-actions .btn{height:var(--btn-sm)}
.tour-item{justify-content:space-between;text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
